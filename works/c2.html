<!DOCTYPE html>
<html lang="en">
<head>
    <title>Book Summary</title>
</head>
<body>

    <script>
        // Create book object
        let book = {
            title: "The Alchemist",
            author: "Paulo Coelho",
            year: 1988,

            getSummary: function() {
                return "The book '" + this.title + "' was written by " + this.author + " in " + this.year + ".";
            }
        };

        // Function to display summary
        function printBookSummary(bookObj) {
            document.write(bookObj.getSummary());
        }

        // Call the function
        printBookSummary(book);

    </script>

</body>
</html>
