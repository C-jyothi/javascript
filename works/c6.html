<!DOCTYPE html>
<html>
<body>

<h2>Product Listing</h2>

<script>

// Product names and prices
let products = ["Apple", "Banana", "Orange"];
let prices = [50, 30, 70];

// Merge product names and prices
let productList = [];

for (let i = 0; i < products.length; i++) {
    productList.push("Product: " + products[i] + " - Price: " + prices[i]);
}

// Display all products
console.log("All Products:");
for (let i = 0; i < productList.length; i++) {
    console.log(productList[i]);
}

// Filter products with price greater than 50
console.log("Products with Price > 50:");
for (let i = 0; i < prices.length; i++) {
    if (prices[i] > 50) {
        console.log("Product: " + products[i] + " - Price: " + prices[i]);
    }
}

// Add new product
products.push("Watermelon");
prices.push(80);

// Display updated product list
console.log("Updated Product List:");

for (let i = 0; i < products.length; i++) {
    console.log("Product: " + products[i] + " - Price: " + prices[i]);
}

</script>

</body>
</html>
