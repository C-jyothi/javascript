<!DOCTYPE html>
<html>
<body>

<h2>Student Result Dashboard</h2>

<script>

// Array of student objects
let students = [
    { name: "Arun", score: 75 },
    { name: "Meena", score: 95 },
    { name: "Ravi", score: 50 },
    { name: "Priya", score: 65 }
];

// 1. List all student names
let allNames = students.map(student => student.name);
console.log("All Student Names:", allNames);

// 2. Students who scored more than 60
let above60 = students
    .filter(student => student.score > 60)
    .map(student => student.name);

console.log("Students scoring above 60:", above60);

// 3. Total score of all students
let totalScore = students.reduce(
    (sum, student) => sum + student.score,
    0
);

console.log("Total Score:", totalScore);

// 4. Check if all students passed (score > 35)
let allPassed = students.every(
    student => student.score > 35
);

console.log("All Students Passed:", allPassed);

// 5. Check if at least one student scored more than 90
let hasTopper = students.some(
    student => student.score > 90
);

console.log("At least one student scored above 90:", hasTopper);

// 6. Sort students by score in descending order
let sortedStudents = [...students].sort(
    (a, b) => b.score - a.score
);

console.log("Students Sorted by Score:");

sortedStudents.forEach(student => {
    console.log(student.name + " - " + student.score);
});

</script>

</body>
</html>
