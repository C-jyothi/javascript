<!DOCTYPE html>
<html>
<body>

<h2>Event Reminder Tool</h2>

<label>Enter a past date:</label>
<input type="date" id="eventDate">

<button onclick="showDetails()">Check</button>

<p id="result"></p>

<script>

function showDetails() {

    let inputDate = document.getElementById("eventDate").value;

    let date = new Date(inputDate);

    let year = date.getFullYear();

    let monthNames = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
    ];

    let month = monthNames[date.getMonth()];

    let day = date.getDate();

    let today = new Date();

    let yearsPassed = today.getFullYear() - year;

    if (
        today.getMonth() < date.getMonth() ||
        (today.getMonth() === date.getMonth() &&
         today.getDate() < date.getDate())
    ) {
        yearsPassed--;
    }

    let message;

    if (yearsPassed >= 1) {
        message = "It has been more than a year since that date.";
    } else {
        message = "It has been less than a year since that date.";
    }

    document.getElementById("result").innerHTML =
        "Year: " + year + "<br>" +
        "Month: " + month + "<br>" +
        "Day: " + day + "<br>" +
        "Full Years Passed: " + yearsPassed + "<br><br>" +
        message;
}

</script>

</body>
</html>
